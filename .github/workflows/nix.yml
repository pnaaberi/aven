name: Nix

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  flake:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: cachix/install-nix-action@v31
      - name: Build package
        run: nix build --no-link --print-build-logs
      - name: Build release flake against the latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(gh release view --json tagName --jq .tagName)"
          gh release download "$version" --pattern '*.sha256' --dir checksums
          scripts/assemble-nix-release "$version" checksums aven-nix.tar.gz
          nix build --no-link --print-build-logs "file://$PWD/aven-nix.tar.gz"
